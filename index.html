<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas Perjalanan Developing Winning Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B2A4E; --ink:#1B2A4E; --muted:#586477; --line:#D6DEE4; --paper:#F1F5F6; --white:#fff;
  --orange:#F5A623; --orange-ink:#8A5000; --cream:#FDEFD9; --orange-soft:#FFF5E3;
  --teal:#0E7C7B; --teal-deep:#0A5A59; --teal-mist:#E2F1F0;
  --sw-delegate:#1F4E8C; --sw-bimbing:#4A9BD4; --sw-perhatian:#F5A623; --sw-motivasi:#D2562B;
  --j-open:#0E9F97; --j-blind:#F5A623; --j-hidden:#5F86B8; --j-unknown:#9AA5B1;
  --focus:#1B2A4E;
}
.theme-orange{--acc:var(--orange);--acc-ink:var(--orange-ink);--acc-soft:var(--orange-soft);--acc-on:var(--navy)}
.theme-teal{--acc:var(--teal);--acc-ink:var(--teal-deep);--acc-soft:var(--teal-mist);--acc-on:#fff}
.theme-navy{--acc:var(--navy);--acc-ink:var(--navy);--acc-soft:#E8ECF4;--acc-on:#fff}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:150px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Montserrat','Nunito Sans',system-ui,sans-serif;color:var(--navy);margin:0;line-height:1.18}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
img{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- chrome ---------- */
.chrome{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)}
.brandbar{max-width:1240px;margin:0 auto;padding:10px 24px 4px;display:flex;align-items:center;gap:14px}
.brandbar img.dan{height:24px;width:auto}
.brandbar img.bsi{height:27px;width:auto}
.brandbar .sep{width:1px;height:24px;background:var(--line)}
.brandbar .ttl{font:800 14px 'Montserrat',sans-serif;color:var(--navy);margin-left:6px}
.brandbar .who{margin-left:auto;text-align:right;font-size:13px;color:var(--muted);line-height:1.3}
.brandbar .who b{display:block;color:var(--navy);font-weight:700}
.route{max-width:1240px;margin:0 auto;padding:6px 24px 10px;display:flex;overflow-x:auto;scrollbar-width:none}
.route::-webkit-scrollbar{display:none}
.stop{flex:1 0 96px;position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:2px 4px;font:700 12.5px 'Nunito Sans',sans-serif;color:var(--muted);min-width:96px}
.stop::before{content:'';position:absolute;top:19px;right:50%;width:100%;height:3px;background:var(--line);z-index:0}
.stop:first-child::before{display:none}
.stop.linked::before{background:var(--navy)}
.stop .node{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--line);background:#fff;display:grid;place-items:center;font:800 14px 'Montserrat',sans-serif;color:var(--muted);transition:background .2s,border-color .2s}
.stop.orange .node{--nc:var(--orange)} .stop.teal .node{--nc:var(--teal)} .stop.navy .node{--nc:var(--navy)}
.stop.part .node{border-color:var(--nc);color:var(--navy);background:color-mix(in srgb,var(--nc) 26%,#fff)}
.stop.full .node{background:var(--nc);border-color:var(--nc);color:#fff}
.stop.orange.full .node{color:var(--navy)}
.stop.on{color:var(--navy)}
.stop.on .node{box-shadow:0 0 0 4px rgba(27,42,78,.14);border-color:var(--navy)}
.stop.on.full .node,.stop.on.part .node{border-color:var(--navy)}
.stop svg{width:16px;height:16px}

/* ---------- layout ---------- */
main{max-width:1240px;margin:0 auto;padding:30px 24px 64px}
.view-head{max-width:780px;margin-bottom:24px}
.kicker{font:700 13.5px 'Montserrat',sans-serif;color:var(--acc-ink);margin-bottom:8px}
.view-head h1{font-size:clamp(27px,3.8vw,40px);font-weight:800;letter-spacing:-.015em}
.lede{color:var(--muted);font-size:17px;margin-top:12px;max-width:66ch}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:32px;align-items:start}
.aside{position:sticky;top:138px;display:grid;gap:18px}
.col-main{display:grid;gap:18px;min-width:0}
@media(max-width:1020px){.sgrid{grid-template-columns:1fr}.aside{position:static}}

.panel{background:#fff;border-radius:16px;min-width:0}
.panel.plain{border:1px solid var(--line);padding:24px}
.panel.accent{border:2px solid var(--acc);overflow:hidden}
.panel.accent>.ph{background:var(--acc);color:var(--acc-on);padding:12px 22px;font:800 15.5px 'Montserrat',sans-serif}
.panel.accent>.pb{padding:22px}
.panel h2.t{font-size:20px;font-weight:800;margin-bottom:6px}
.help{color:var(--muted);font-size:15px;margin-bottom:16px}
.mini{font-size:13.5px;color:var(--muted)}
.stack{display:grid;gap:16px}

/* ---------- form ---------- */
.f{display:block;position:relative}
.fl{display:block;font:700 14px 'Nunito Sans',sans-serif;color:var(--navy);margin-bottom:6px}
.f input,.f textarea,.f select,input.plain,select.plain{width:100%;background:#fff;border:1.5px solid #C4CED6;border-radius:10px;padding:11px 13px;font-size:16px;line-height:1.45}
.f textarea{resize:vertical;min-height:84px}
.f input:focus,.f textarea:focus,.f select:focus,input.plain:focus,select.plain:focus{outline:none;border-color:var(--acc,var(--navy));box-shadow:0 0 0 3px color-mix(in srgb,var(--acc,var(--navy)) 25%,transparent)}
.f input::placeholder,.f textarea::placeholder{color:#8B96A5}
.cnt{display:block;text-align:right;font-size:12px;color:#6F7B8B;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:999px;border:2px solid var(--navy);background:var(--navy);color:#fff;font:800 14.5px 'Montserrat',sans-serif;transition:background .15s,color .15s}
.btn:hover{background:#2B3D6B}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--acc-on)}
.btn.acc:hover{filter:brightness(.95);background:var(--acc)}
.btn.ghost{background:#fff;color:var(--navy)}
.btn.ghost:hover{background:#EEF2F6}
.btn.sm{min-height:38px;padding:6px 15px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.navrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}
.linkbtn{background:none;border:0;padding:6px 2px;color:var(--acc-ink);font:800 14px 'Montserrat',sans-serif;text-decoration:underline;text-underline-offset:3px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:5px 13px;border-radius:999px;border:1.5px solid #C4CED6;background:#fff;font:600 13.5px 'Nunito Sans',sans-serif;color:var(--navy);transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--acc,var(--navy));background:var(--acc-soft,#EEF2F6)}
.chip[aria-pressed=true],.chip.on{background:var(--acc,var(--navy));border-color:var(--acc,var(--navy));color:var(--acc-on,#fff)}
.chip.custom{border-style:dashed}
.chipgroup+.chipgroup{margin-top:12px}
.cg-l{font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:700}
.tipbox{background:var(--acc-soft);border-radius:12px;padding:14px 16px;font-size:15px;color:var(--navy)}
.tipbox b{font-weight:800}

.sentence{margin-top:16px;padding:18px 20px;border-radius:14px;background:var(--cream);font:600 19px/1.5 'Nunito Sans',sans-serif;color:var(--navy)}
.sentence b{font-weight:800;border-bottom:2.5px solid var(--orange)}
.sentence i{color:#9A8F7C;font-style:normal;letter-spacing:.06em}
.examples{margin-top:16px}
.examples .ex{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 14px;border:1.5px dashed #C4CED6;border-radius:12px;background:#fff;font-size:14.5px;color:var(--navy)}
.examples .ex:hover{border-color:var(--orange);background:var(--orange-soft)}

/* ---------- home ---------- */
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:44px;align-items:start}
@media(max-width:980px){.home{grid-template-columns:1fr;gap:28px}}
.home h1{font-size:clamp(34px,5vw,54px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.home .lede{font-size:18px;margin-top:16px}
.home .who-form{margin-top:26px;display:grid;gap:14px;max-width:460px}
.home .cta{margin-top:20px;display:flex;gap:12px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.tiles{grid-template-columns:1fr}}
.tile{position:relative;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:190px;padding:0;background:#fff;border:2px solid var(--acc);border-radius:16px;overflow:hidden;color:var(--navy)}
.tile .th{background:var(--acc);color:var(--acc-on);padding:9px 14px;font:800 13.5px 'Montserrat',sans-serif}
.tile .tb{padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.tile h3{font-size:17px;font-weight:800}
.tile p{font-size:14px;color:var(--muted)}
.tile .tool{font-size:13px;font-weight:700;color:var(--acc-ink)}
.tile .meter{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--navy)}
.bar4{display:flex;gap:4px;flex:1}
.bar4 i{height:7px;flex:1;border-radius:4px;background:#E3E9EE}
.bar4 i.on{background:var(--acc)}
.tile:hover{background:var(--acc-soft)}
.datatools{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.privacy{font-size:14px;color:var(--muted);margin-top:18px;max-width:60ch}

/* ---------- sub stepper ---------- */
.substeps{display:flex;gap:6px;margin-bottom:2px}
.substeps button{flex:1;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font:700 13px 'Nunito Sans',sans-serif;color:var(--muted);min-width:0}
.substeps button small{display:block;font-size:11.5px;font-weight:600;opacity:.85}
.substeps button.on{border-color:var(--acc);background:var(--acc-soft);color:var(--navy)}
.substeps button.done{color:var(--navy)}
@media(max-width:620px){.substeps button small{display:none}.substeps button{padding:9px 8px;font-size:12px}}

details.expl{border:1px solid var(--line);border-radius:14px;background:#fff;padding:0}
details.expl>summary{cursor:pointer;list-style:none;padding:15px 20px;font:800 16px 'Montserrat',sans-serif;color:var(--navy);display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px}
details.expl>summary::-webkit-details-marker{display:none}
details.expl>summary::after{content:'+';font:700 22px 'Nunito Sans',sans-serif;color:var(--acc-ink)}
details.expl[open]>summary::after{content:'\2212'}
details.expl .eb{padding:0 20px 20px;display:grid;gap:12px;font-size:15.5px}
.eb p{max-width:74ch}
.mini-j{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;max-width:520px}
.mini-j div{padding:12px 14px;font-size:13.5px;line-height:1.4}
.mini-j b{display:block;font:800 14px 'Montserrat',sans-serif;margin-bottom:2px}

/* ---------- roster ---------- */
.roster{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:30px 1.2fr 1fr 38px;gap:8px;align-items:center}
.mrow input{width:100%;background:#fff;border:1.5px solid #C4CED6;border-radius:10px;padding:9px 12px;font-size:15.5px;min-height:44px}
.mrow input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.mnum{width:28px;height:28px;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);display:grid;place-items:center;font:800 13px 'Montserrat',sans-serif}
.mrow .x{width:38px;height:38px;border-radius:50%;border:0;background:#EEF1F4;font-size:20px;line-height:1;color:var(--muted)}
.mrow .x:hover{background:#FBE3DC;color:#B23A1B}
@media(max-width:620px){.mrow{grid-template-columns:28px 1fr 38px}.mrow input:nth-of-type(2){grid-column:2/3;grid-row:2}.mrow .x{grid-row:1;grid-column:3}}
.empty{color:var(--muted);font-size:15px;padding:6px 0}

/* ---------- Johari ---------- */
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .tn{font-weight:800;color:var(--navy);font-size:15.5px}
.trow .td{font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:1px}
.trow.map{grid-template-columns:minmax(0,1fr) auto auto}
.tgl{min-height:44px;padding:8px 15px;border:1.5px solid #C4CED6;border-radius:999px;background:#fff;font:700 13.5px 'Nunito Sans',sans-serif;color:var(--navy);white-space:nowrap}
.tgl[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.tgl.big{min-width:150px}
.trow.on{background:linear-gradient(90deg,var(--teal-mist),transparent)}
.area-tag{display:inline-block;margin-top:5px;font:800 12px 'Nunito Sans',sans-serif;padding:3px 10px;border-radius:999px}
.trow[data-area=open] .area-tag,.tag-open{background:#DDF3F1;color:#0A5F5A}
.trow[data-area=blind] .area-tag,.tag-blind{background:#FEEFD0;color:#8A5200}
.trow[data-area=hidden] .area-tag,.tag-hidden{background:#E4ECF7;color:#33557F}
.trow[data-area=unknown] .area-tag,.tag-unknown{background:#ECEFF2;color:#4B5563}
@media(max-width:700px){.trow.map{grid-template-columns:1fr 1fr}.trow.map>div:first-child{grid-column:1/-1}.tgl{white-space:normal;line-height:1.2}}
.mtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.counts div{border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700}
.counts b{display:block;font:800 22px 'Montserrat',sans-serif;line-height:1.1}
@media(max-width:560px){.counts{grid-template-columns:1fr 1fr}}
.jw{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.jw>div{padding:14px 16px;min-height:120px}
.jw h4{font-size:14.5px;font-weight:800;margin-bottom:2px}
.jw small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:8px}
.jw .chips{gap:6px}.jw .chip{min-height:30px;padding:3px 10px;font-size:12.5px;cursor:default;background:rgba(255,255,255,.85)}
.jw .chip:hover{background:rgba(255,255,255,.85);border-color:#C4CED6}
.jw .o{background:#E8F6F4}.jw .b{background:#FFF4DD}.jw .h{background:#EAF0F9}.jw .u{background:#F1F3F5}
@media(max-width:560px){.jw{grid-template-columns:1fr}}
.stackbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#E9EEF2}
.stackbar i{display:block;height:100%}
.cmp{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center;padding:7px 0;font-size:14px;font-weight:700}
.cmp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rec{border-left:4px solid var(--c,#ccc);background:#fff;border-radius:0 12px 12px 0;padding:12px 16px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.rec h4{font-size:15px;font-weight:800;margin-bottom:3px}
.rec p{font-size:14.5px;color:#334155}
.recs{display:grid;gap:10px}
.sub-h{font:800 17px 'Montserrat',sans-serif;color:var(--navy);margin:2px 0 10px}
.composer{display:grid;gap:12px}
.cprev{background:var(--acc-soft);border-radius:12px;padding:13px 16px;font-size:15.5px;color:var(--navy);font-weight:600;min-height:52px}
.cprev.empty-p{color:#7A8594;font-weight:500}
.pick .chip{display:inline-flex;align-items:center;gap:7px}
.pick .dot{width:9px;height:9px;border-radius:50%}
.sep-line{height:1px;background:var(--line);margin:8px 0}

.opt-g{margin-top:10px}
.opt-g .cg-l span{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.grow-b{display:grid;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.grow-b:first-child{padding-top:0}
.grow-b:last-child{border-bottom:0;padding-bottom:0}
.grow-b h3{font:800 15px 'Montserrat',sans-serif;color:var(--acc-ink);display:flex;gap:10px;align-items:baseline}
.grow-b h3 small{font:600 13px 'Nunito Sans',sans-serif;color:var(--muted)}

/* ---------- preview ---------- */
.preview{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.pv-title{font:800 14px 'Montserrat',sans-serif;color:var(--navy);margin-bottom:10px}
.pv-foot{margin-top:6px;text-align:right}
.meter-line{height:8px;border-radius:5px;background:#E3E9EE;overflow:hidden;margin-top:6px}
.meter-line i{display:block;height:100%;background:var(--navy);border-radius:5px;transition:width .3s}

/* ---------- canvas ---------- */
.canvas-wrap{container-type:inline-size;width:100%}
.canvas{--fs:1cqw;font-size:var(--fs);aspect-ratio:281/194;background:#fff;border:1px solid var(--line);border-radius:14px;padding:1.9em 2.2em 2em;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto 1fr;grid-template-areas:"logos logos" "title who" "grid grid";column-gap:2.5em;row-gap:1.1em;color:var(--navy)}
.cv-logos{grid-area:logos;display:flex;justify-content:space-between;align-items:center}
.cv-logos img{width:auto}
.cv-dan{height:2.7em}.cv-bsi{height:2.6em}
.cv-title{grid-area:title;align-self:end}
.cv-title h2{font:800 2.25em/1.1 'Montserrat',sans-serif;color:var(--navy);letter-spacing:-.01em}
.cv-title p{font-style:italic;color:var(--muted);font-size:1.05em;margin-top:.55em;max-width:70em;line-height:1.35}
.cv-who{grid-area:who;align-self:end;border:.2em solid var(--teal);border-radius:1.1em;padding:.9em 1.5em;display:grid;gap:.5em;min-width:30em}
.cv-who label{display:grid;grid-template-columns:9.8em .8em 1fr;align-items:end;font-size:1.05em;font-weight:800;color:var(--muted);white-space:nowrap}
.cv-who input{border:0;border-bottom:1px solid #C9D1D8;background:transparent;font:600 1em 'Nunito Sans',sans-serif;color:var(--navy);padding:.15em .2em;min-width:0;width:100%;border-radius:0}
.cv-who input:focus{outline:none;background:rgba(14,124,123,.08)}
.cv-grid{grid-area:grid;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1.3em;min-height:0}

.qcard{container-type:inline-size;border:2px solid var(--c);border-radius:14px;overflow:hidden;background:#fff;min-height:0;min-width:0}
.qcard.t-orange{--c:var(--orange);--pt:var(--navy);--lc:var(--navy)}
.qcard.t-teal{--c:var(--teal);--pt:#fff;--lc:var(--teal)}
.qin{font-size:2.3cqw;height:100%;display:flex;flex-direction:column;padding:.7em .7em .8em}
.pill{background:var(--c);color:var(--pt);text-align:center;font:800 1.2em/1.1 'Montserrat',sans-serif;padding:.62em .6em;border-radius:.6em}
.qbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:.55em;padding:.7em .5em 0}
.sub{font-style:italic;color:var(--muted);font-size:.92em;line-height:1.3}
.cream{background:var(--cream);border-radius:1em;padding:.75em 1em;flex:1.35;min-height:0;display:flex;flex-direction:column;gap:.35em}
.srow{flex:1;min-height:0;display:flex;gap:.7em;align-items:stretch}
.sl{flex:none;width:7.4em;white-space:nowrap;font-weight:800;color:var(--orange-ink);font-size:.95em;padding-top:.05em}
.fld{flex:1;min-height:0;display:flex;flex-direction:column}
.lbl{font-weight:800;color:var(--lc);font-size:.9em;line-height:1.25;margin-bottom:.15em}
.lbl.it{font-style:italic;font-weight:600;color:var(--muted)}
.val{flex:1;min-height:0;overflow:hidden;font-size:calc(1em*var(--k,1));line-height:1.3;border-bottom:1px solid #C9D1D8;white-space:pre-wrap;word-break:break-word;padding:.1em .15em;color:var(--navy);font-weight:600}
.val:empty::before{content:attr(data-ph);color:#A2ACB8;font-weight:400;font-style:italic}
.srow .val{border-bottom:1px solid rgba(138,80,0,.35)}
.canvas.editable .val[contenteditable]:hover{background:rgba(245,166,35,.12)}
.canvas.editable .val[contenteditable]:focus{outline:2px solid var(--teal);outline-offset:1px;border-radius:3px;background:#fff}
.qcard.fixed{height:100%}
.qcard[data-q="2"] .fld:last-child{flex:1.25}
.qcard[data-q="4"] .fld:last-child{flex:1.4}
.qcard[data-q="4"] .fld:nth-child(3){flex:1.15}
.qcard.flow .qin{font-size:3.5cqw}
.qcard.flow .val{min-height:2.7em;flex:none}
.qcard.flow .fld{flex:none}
.qcard.flow .cream{flex:none}
.qcard.flow .srow{flex:none}
.qcard.flow .qbody{gap:.75em}
.qcard.flow .val::before{font-size:.9em}
@media(max-width:820px){
  .canvas{aspect-ratio:auto;grid-template-columns:1fr;grid-template-areas:"logos" "title" "who" "grid";font-size:2.6cqw;padding:1.6em}
  .cv-who{min-width:0}
  .cv-grid{grid-template-columns:1fr;grid-template-rows:none}
  .cv-title h2{font-size:2.5em}
  .cv-dan{height:2.2em}.cv-bsi{height:2.1em}
  .canvas .qcard{height:auto}
  .canvas .qin{font-size:3.6cqw}
  .canvas .val{flex:none;min-height:2.6em}
  .canvas .fld,.canvas .srow,.canvas .cream{flex:none}
  .canvas .srow .val{flex:1 1 0;min-width:0}
}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.progress-note{margin-left:auto;font-size:14px;color:var(--muted);min-width:220px}
.progress-note b{color:var(--navy)}
@media(max-width:700px){.progress-note{margin-left:0;width:100%}}
.lampiran{margin-top:44px}
.lampiran>h2{font-size:26px;font-weight:800;margin-bottom:6px}
.lam-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:26px;margin-top:18px;align-items:start}
@media(max-width:980px){.lam-grid{grid-template-columns:1fr}}
.arch{background:var(--cream);border-radius:14px;padding:18px 20px;font-size:16.5px;line-height:1.6;color:var(--navy);max-width:90ch}
.arch b{font-weight:800}

.foot{max-width:1240px;margin:0 auto;padding:6px 24px 40px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.foot img{height:22px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- print ---------- */
@page{size:A4 landscape;margin:8mm}
@media print{
  html,body{background:#fff!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .chrome,.foot,.toast,.actions,.view-head,.sendbar,.no-print{display:none!important}
  main{padding:0;max-width:none}
  .canvas-wrap{width:281mm}
  .canvas{border:0;border-radius:0;aspect-ratio:281/194;font-size:1cqw;grid-template-columns:1fr auto;grid-template-areas:"logos logos" "title who" "grid grid";padding:1.9em 2.2em 2em}
  .cv-grid{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .cv-title h2{font-size:2.25em}
  .canvas .qcard{height:100%}
  .canvas .qin{font-size:2.3cqw}
  .canvas .val{flex:1;min-height:0}
  .canvas .fld{flex:1}
  .canvas .srow{flex:1}
  .canvas .cream{flex:1.35}
  .val:empty::before{content:''}
  .cv-who input::placeholder{color:transparent}
  .lampiran{display:none;margin-top:0}
  body.print-full .lampiran{display:block;break-before:page}
  .lam-grid{grid-template-columns:1fr 1fr!important;gap:6mm;margin-top:10px}
  .lampiran>h2{font-size:20px}
  .lampiran>.lede{display:none}
  .lampiran .sub-h{font-size:14px;margin-bottom:6px}
  .lampiran .arch{max-width:none;font-size:12.5px;padding:10px 14px;margin-top:8px!important;line-height:1.5}
  .lampiran .rec{padding:6px 10px}
  .lampiran .rec p{font-size:11px;line-height:1.35}
  .lampiran .rec h4{font-size:12.5px}
  .lampiran .cmp{padding:3px 0;font-size:12px}
  .lampiran .recs{gap:6px}
  .panel,.qrec,.cross{break-inside:avoid}
  body.admin-mode .adm-head,body.admin-mode .adm-stats,body.admin-mode .adm-filter,
  body.admin-mode .adm-meta,body.admin-mode .rh .dots,body.admin-mode .rh .when,
  body.admin-mode .rh .caret,body.admin-mode .adm-row:not(.open){display:none!important}
  body.admin-mode .adm-row{border:0;border-radius:0;break-after:page}
  body.admin-mode .adm-row:last-of-type{break-after:auto}
  body.admin-mode .adm-row>.rh{border:0;padding:0 0 3mm}
  body.admin-mode .adm-body{padding:0}
  body.admin-mode .adm-list{gap:0}
}

@media(max-width:640px){
  main{padding:22px 16px 56px}
  .brandbar{padding:8px 16px 2px;gap:10px}
  .brandbar .ttl{display:none}
  .brandbar img.dan{height:20px}.brandbar img.bsi{height:22px}
  .brandbar .who{max-width:42vw;font-size:12px;overflow:hidden}
  .brandbar .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .route{padding:6px 12px 10px}
  .panel.plain{padding:18px}.panel.accent>.pb{padding:18px}
  .foot{padding:6px 16px 32px}
}


/* ============ Kirim ke fasilitator ============ */
.sendbar{margin-top:24px;border:2px dashed var(--acc);background:var(--acc-soft);border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:16px 18px;flex-wrap:wrap}
.sendbar.ok{border-style:solid;border-color:var(--teal);background:var(--teal-mist)}
.sendbar.warn{border-style:solid;border-color:var(--orange);background:var(--orange-soft)}
.sendbar .sb-x{flex:1 1 280px;min-width:0}
.sendbar .sb-t{font:800 15px 'Montserrat',sans-serif;color:var(--navy);margin-bottom:3px;display:flex;align-items:center;gap:7px}
.sendbar .sb-t svg{width:15px;height:15px;flex:0 0 auto}
.sendbar .sb-m{font-size:14px;color:var(--muted);line-height:1.45}
.sendbar .btn{flex:0 0 auto}
.sendbar .btn[disabled]{opacity:.5;cursor:not-allowed}

/* ============ Dashboard fasilitator ============ */
.admin-mode .route,.admin-mode .who{display:none}
.admin-mode .brandbar{padding-bottom:6px}
.admlink{margin-left:auto;background:none;border:0;padding:4px 2px;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.admlink:hover{color:var(--navy)}

.adm-gate{max-width:430px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 28px;text-align:center}
.adm-gate h1{font-size:22px;margin-bottom:8px}
.adm-gate p{font-size:14.5px;color:var(--muted);margin-bottom:20px}
.adm-gate .f{text-align:left}
.adm-gate .btn{width:100%;margin-top:14px}
.adm-gate .err{margin-top:14px;background:#FDECEA;color:#8A1C13;border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600}
.adm-gate .back{margin-top:16px}

.adm-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.adm-head .ah-x{flex:1 1 320px;min-width:0}
.adm-head h1{font-size:26px}
.adm-head .sub{font-size:14px;color:var(--muted);margin-top:4px}
.adm-tools{display:flex;gap:9px;flex-wrap:wrap}

.adm-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.adm-stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.adm-stat b{display:block;font:800 26px 'Montserrat',sans-serif;color:var(--navy);line-height:1.1}
.adm-stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.adm-stat .mini-bar{margin-top:8px;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.adm-stat .mini-bar i{display:block;height:100%;background:var(--teal);border-radius:99px}

.adm-filter{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.adm-filter input{flex:1 1 240px;min-width:0;height:42px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff}
.adm-filter .cnt-note{font-size:13px;color:var(--muted);font-weight:600}

.adm-empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:40px 24px;text-align:center;color:var(--muted)}
.adm-empty b{display:block;color:var(--navy);font-size:17px;margin-bottom:6px;font-family:'Montserrat',sans-serif}

.adm-list{display:flex;flex-direction:column;gap:10px}
.adm-row{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.adm-row>.rh{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;background:none;border:0;text-align:left}
.adm-row>.rh:hover{background:#F7FAFB}
.adm-row.open>.rh{border-bottom:1px solid var(--line)}
.rh .nm{flex:1 1 200px;min-width:0}
.rh .nm b{display:block;font:800 15px 'Montserrat',sans-serif;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh .nm span{font-size:12.5px;color:var(--muted)}
.rh .dots{display:flex;gap:5px;flex:0 0 auto}
.rh .dots i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:800 11.5px 'Montserrat',sans-serif;font-style:normal;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.rh .dots i.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.rh .when{flex:0 0 auto;font-size:12px;color:var(--muted);font-weight:600;text-align:right;min-width:112px}
.rh .caret{flex:0 0 auto;width:16px;height:16px;color:var(--muted);transition:transform .15s}
.adm-row.open .caret{transform:rotate(180deg)}

.adm-body{padding:4px 16px 20px}
.adm-meta{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 14px;border-top:1px solid var(--line);margin-bottom:4px}
.adm-meta span{font-size:12px;font-weight:600;color:var(--muted);background:var(--paper);border-radius:999px;padding:4px 12px}
.adm-meta span.yes{background:var(--teal-mist);color:var(--teal-deep)}
.adm-meta span.yes b{color:var(--teal-deep)}
.adm-meta span.no i{font-style:italic;opacity:.75}
.adm-body .canvas-wrap{margin-bottom:6px}
.adm-body .canvas{box-shadow:0 1px 3px rgba(27,42,78,.07)}
.adm-body .cv-who input{cursor:default}
.adm-body .lampiran{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.adm-body .lampiran>h2{font-size:18px}
.adm-sesi{border-top:1px solid var(--line);padding-top:14px;margin-top:12px}
.adm-sesi:first-child{border-top:0;margin-top:0;padding-top:6px}
.adm-sesi h4{font-size:14px;font-weight:800;color:var(--navy);display:flex;align-items:baseline;gap:9px;margin-bottom:10px}
.adm-sesi h4 small{font-weight:600;color:var(--muted);font-size:12px}
@media (max-width:760px){
  .rh .when{display:none}
  .adm-head h1{font-size:22px}
}

/* ============ Sesi 3: tabel pemetaan ============ */
.maphead{display:grid;grid-template-columns:minmax(0,1fr) 132px 132px;gap:14px;padding:0 2px 9px;border-bottom:2px solid var(--line)}
.maphead div{font:800 12.5px 'Nunito Sans',sans-serif;color:var(--muted)}
.maphead div+div{color:var(--teal-deep);text-align:center}
@media(max-width:700px){.maphead{display:none}}
.maphead.two{grid-template-columns:minmax(0,1fr) 150px}
@media(min-width:701px){
  .trow.map{grid-template-columns:minmax(0,1fr) 132px 132px}
  .trow.map .tgl{width:100%;justify-content:center}
}

.mtab{display:inline-flex;align-items:center;gap:8px;max-width:240px}
.mtab .tab-dot{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;opacity:.4;flex:0 0 auto}
.mtab .tab-dot.partial{background:var(--orange);border-color:var(--orange);opacity:1}
.mtab .tab-dot.done{background:currentColor;opacity:1}
.mtab.on .tab-dot.partial{background:#fff;border-color:#fff}
.mtab .tab-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mtab .tab-count{font:800 11.5px 'Nunito Sans',sans-serif;opacity:.7;flex:0 0 auto}

/* ============ Sesi 3: hasil ============ */
.note{display:flex;gap:11px;font-size:14.5px;line-height:1.6;color:var(--ink);margin-bottom:10px}
.note:last-child{margin-bottom:0}
.note .nd{width:7px;height:7px;border-radius:3px;background:var(--orange);margin-top:8px;flex:0 0 auto}

.jmx-wrap{overflow-x:auto;margin-top:4px}
.jmx{border-collapse:collapse;min-width:100%}
.jmx th,.jmx td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.jmx th{font:800 12px 'Nunito Sans',sans-serif;color:var(--navy)}
.jmx .mx-t{text-align:left;font-size:13.5px;font-weight:600;color:var(--ink);position:sticky;left:0;background:#fff}
.jmx thead .mx-t{color:var(--muted)}
.jmx .mx-d{display:inline-block;width:13px;height:13px;border-radius:50%}

.mcard{border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px;background:#fff}
.mcard-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mcard-h .avatar{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#fff;display:grid;place-items:center;font:800 17px 'Montserrat',sans-serif;flex:0 0 auto}
.mcard-h b{font:800 18px 'Montserrat',sans-serif;color:var(--navy);display:block;line-height:1.15}
.mcard-h small{font-size:13px;color:var(--muted)}

.commit{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.commit .f textarea{min-height:64px}

.lam-commit{margin-top:14px}
.lam-commit .lc{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin-bottom:7px;font-size:13.5px;line-height:1.5}
.lam-commit .lc b{color:var(--navy)}
</style>
</head>

  };

var state = blank();

function merge(base, inc){
  if (!inc || typeof inc !== 'object') return base;
  Object.keys(base).forEach(function(k){
    if (!(k in inc)) return;
    var b = base[k], i = inc[k];
    if (Array.isArray(b)) { if (Array.isArray(i)) base[k] = i; }
    else if (b && typeof b === 'object'){
      /* objek kosong = peta dengan kunci dinamis (self, map, rate): terima apa adanya */
      if (!Object.keys(b).length && i && typeof i === 'object' && !Array.isArray(i)) base[k] = i;
      else base[k] = merge(b, i);
    }
    else if (typeof b === typeof i) base[k] = i;
  });
  return base;
}

function classify(seen, aware){ if (seen && aware) return 'open'; if (seen && !aware) return 'blind'; if (!seen && aware) return 'hidden'; return 'unknown'; }
function jmap(id){ return state.j.map[id] || {seen:{},aware:{}}; }
function buckets(id){
  var mp = jmap(id), b = {open:[],blind:[],hidden:[],unknown:[]};
  state.j.traits.forEach(function(t){ b[classify(!!mp.seen[t], !!mp.aware[t])].push(t); });
  return b;
}
function mapped(id){
  var mp = state.j.map[id]; if (!mp) return false;
  return Object.keys(mp.seen).some(function(k){ return mp.seen[k]; }) || Object.keys(mp.aware).some(function(k){ return mp.aware[k]; });
}

function teamSummary(){
  var ms = members().filter(function(m){ return mapped(m.id); });
  var totals = {open:0,blind:0,hidden:0,unknown:0}, openL=[], blindH=[], unkH=[], openCount={};
  ms.forEach(function(m){
    var b = buckets(m.id);
    Object.keys(totals).forEach(function(k){ totals[k] += b[k].length; });
    if (b.open.length >= 4) openL.push(firstName(m));
    if (b.blind.length >= 3) blindH.push(firstName(m));
    if (b.unknown.length >= 3) unkH.push(firstName(m));
    b.open.forEach(function(t){ openCount[t] = (openCount[t]||0) + 1; });
  });
  var topOpen = Object.keys(openCount).sort(function(a,b){ return openCount[b]-openCount[a]; }).slice(0,3);
  var notes = [];
  if (openL.length) notes.push('Kekuatan yang sudah diakui bersama terpusat pada ' + openL.join(', ') + '. Jadikan mereka poros untuk menarik kekuatan rekan lain ke area Terbuka.');
  if (blindH.length) notes.push(blindH.join(', ') + ' menyimpan banyak kekuatan yang belum mereka sadari. Sesi umpan balik terstruktur di tingkat tim akan mempercepat kesadaran bersama.');
  if (unkH.length) notes.push('Potensi ' + unkH.join(', ') + ' sebagian besar belum tergali. Rancang proyek atau rotasi peran supaya kekuatan tersembunyi itu punya panggung.');
  if (!notes.length && ms.length) notes.push('Sebaran kekuatan tim cukup merata. Langkah berikutnya adalah memperluas area Terbuka lewat umpan balik rutin dan keterbukaan antaranggota.');
  return {totals:totals, notes:notes, topOpen:topOpen, n:ms.length};
}

    rpc('dwt_admin_clear', {p_code:adm.code}).then(function(res){
      if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal menghapus.');
      adm.open = {}; toast(res.deleted + ' data dihapus'); admLoad(adm.code);
    }).catch(function(e){ toast(netMsg(e)); });
  }
};

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (ACT[el.dataset.act]) ACT[el.dataset.act](el, e);
});

document.addEventListener('input', function(e){
  var el = e.target;
  if (el.id === 'admQ'){ adm.q = el.value; var L = $('#admList'); if (L) L.innerHTML = admList(); return; }
  if (el.tagName === 'SELECT') return;
  if (el.dataset && el.dataset.cv !== undefined){
    var v = el.innerText.replace(/\u00a0/g, ' ').replace(/\n+$/, '');
    if (!v.trim()){ v = ''; el.innerHTML = ''; }
    state.c[el.dataset.cv] = v.slice(0, MAX[el.dataset.cv] + 40); live(el); return;
  }
  if (el.dataset && el.dataset.bind){ setPath(el.dataset.bind, el.value); live(el); }
});
document.addEventListener('change', function(e){
  var el = e.target;
  if (el.tagName === 'SELECT' && el.dataset.bind){
    setPath(el.dataset.bind, el.value);
    if (el.dataset.bind === 'comp.tim.m') state.comp.tim.k = '';
    rerender(); queueSave();
  }
});
document.addEventListener('paste', function(e){
  var el = e.target; if (!el.dataset || el.dataset.cv === undefined) return;
  e.preventDefault();
  var t = (e.clipboardData || window.clipboardData).getData('text').replace(/\s*\n\s*/g, ' ');
  document.execCommand('insertText', false, t);
});
document.addEventListener('keydown', function(e){
  var el = e.target;
  if (el.dataset && el.dataset.cv !== undefined && e.key === 'Enter'){ e.preventDefault(); el.blur(); }
  if (el.id === 'newTrait' && e.key === 'Enter'){ e.preventDefault(); ACT.addtrait(); }
  if (el.id === 'admCode' && e.key === 'Enter'){ e.preventDefault(); ACT['adm-login'](); }
});
document.addEventListener('toggle', function(e){
  var d = e.target; if (d.dataset && d.dataset.ui){ state.ui[d.dataset.ui] = d.open; queueSave(); }
}, true);

$('#fileIn').addEventListener('change', function(e){
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var obj = JSON.parse(r.result); if (!obj || obj.v !== 1) throw new Error('format');
      state = merge(blank(), obj); state.tab = 'home'; save(); render(); chromeUpdate(); toast('Cadangan berhasil dibuka');
    } catch (err) { toast('File tidak dikenali. Pilih file cadangan dari aplikasi ini.'); }
  };
  r.readAsText(f); e.target.value = '';
});

window.addEventListener('resize', fitSoon);
window.addEventListener('beforeprint', function(){ if (state.tab !== 'canvas' && state.tab !== 'admin'){ state.tab = 'canvas'; render(); } fit(); });
window.addEventListener('afterprint', function(){ document.body.classList.remove('print-full'); });

/* ============ Mulai ============ */
(function init(){
  try { var raw = localStorage.getItem(KEY); if (raw) state = merge(blank(), JSON.parse(raw)); } catch (e) {}
  if (!VIEWS[state.tab]) state.tab = 'home';
  if (location.hash === '#admin') state.tab = 'admin';
  else if (state.tab === 'admin') state.tab = 'home';
  render(); chromeUpdate();
  if (state.tab === 'admin') enterAdmin();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();


})();
</script>
</body>
</html>
